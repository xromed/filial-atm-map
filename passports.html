<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крышные конструкции — карта паспортов</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1c1c1e}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;top:12px;left:12px;background:rgba(255,255,255,.96);border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,.18);padding:12px 14px;max-width:300px;max-height:calc(100% - 24px);overflow:auto;font-size:13px}
  .panel h1{font-size:15px;margin:0 0 4px}
  .panel .sub{color:#6e6e73;margin-bottom:8px}
  .panel ul{list-style:none;margin:0;padding:0}
  .panel li{padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .panel li:hover{background:#f0f0f3}
  .panel li img{width:44px;height:34px;object-fit:cover;border-radius:5px;flex:none}
  .panel li b{display:block;font-size:12.5px}
  .panel li span{color:#6e6e73;font-size:11.5px}
  .leaflet-tooltip.photo-tip{padding:0;border:0;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.3);background:#fff}
  .photo-tip img{display:block;width:320px;height:240px;object-fit:cover}
  .photo-tip .cap{padding:6px 10px;font-size:12px;line-height:1.35}
  .photo-tip .cap b{font-size:13px}
  .leaflet-popup-content{margin:0;width:340px!important}
  .pp img{display:block;width:340px;height:255px;object-fit:cover;border-radius:12px 12px 0 0}
  .pp .body{padding:10px 14px 12px;font-size:12.5px;line-height:1.45}
  .pp .body h3{margin:0 0 4px;font-size:14px}
  .pp table{border-collapse:collapse;width:100%}
  .pp td{padding:2px 0;vertical-align:top}
  .pp td:first-child{color:#6e6e73;width:42%;padding-right:8px}
  .leaflet-popup-content-wrapper{border-radius:12px;padding:0}
  .pin{width:14px;height:14px;border-radius:50%;background:#7f3dff;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
  @media (max-width:600px){.panel{max-width:calc(100% - 24px);max-height:38%}.photo-tip img{width:220px;height:165px}.leaflet-popup-content{width:260px!important}.pp img{width:260px;height:195px}}
</style></head><body>
<div id="map"></div>
<div class="panel">
  <h1>Крышные конструкции</h1>
  <div class="sub" id="count"></div>
  <ul id="list"></ul>
</div>
<script>
const DATA = [
{"passport":"CH-04389","issued":"07.03.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Yashnobod tumani, Mumtoz mahallasi, Farg'ona Yo'li, 505","place_no":"Y-1726290-05498","area_m2":"30","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2.5x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.250135,"lon":69.324491},
{"passport":"CH-04390","issued":"07.03.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Yashnobod tumani, Mumtoz mahallasi, Farg'ona Yo'li, 505","place_no":"Y-1726290-05499","area_m2":"27.5","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2.5x11","tech":"Statik","owner":"MEDIA ROOF","lat":41.250877,"lon":69.323976},
{"passport":"CH-04545","issued":"12.03.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Yunusobod tumani, Yunusobod-4, 22","place_no":"Y-1726266-05855","area_m2":"33","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"3x11","tech":"Statik","owner":"MEDIA ROOF","lat":41.360776,"lon":69.278657},
{"passport":"CH-05052","issued":"22.03.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Shayxontoxur tumani, Chorsu mavzesi, 4","place_no":"S-1726277-05861","area_m2":"24","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.318276,"lon":69.229863},
{"passport":"CH-05897","issued":"03.05.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Yunusobod tumani, Posira mahalla, Bogishamol ko'chasi, 2","place_no":"Y-1726266-05864","area_m2":"30","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2.5x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.358876,"lon":69.338095},
{"passport":"CH-14543","issued":"14.01.2025","valid_until":"31.12.2029","address":"Qoratosh, Qoratosh ko'chasi, 105","place_no":"S-1726277-05821","area_m2":"30","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2.5x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.313861,"lon":69.237888},
{"passport":"CH-16591","issued":"12.02.2025","valid_until":"31.12.2029","address":"Mirzo Ulug`bek mahallasi, Osiyo ko'chasi","place_no":"Y-1726266-05839","area_m2":"30","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2.5x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.327108,"lon":69.291661},
{"passport":"CH-16765","issued":"14.02.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Shayxontoxur tumani, Qoratosh, Qoratosh ko'chasi, 104","place_no":"S-1726277-05837","area_m2":"30","placement":"На крыше","fmt":"Сверхбольшой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"2.5x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.313603,"lon":69.238231},
{"passport":"CH-16766","issued":"14.02.2025","valid_until":"31.12.2029","address":"Toshkent shahri, Chilonzor tumani, Chilonzor-I, 11","place_no":"C-1726294-05879","area_m2":"15.6","placement":"На крыше","fmt":"Большой формат","ctype":"Крышная конструкция (буквы)","sides":"1","size":"1.3x12","tech":"Statik","owner":"MEDIA ROOF","lat":41.292776,"lon":69.225313}
];
DATA.forEach(d => d.img = 'passports/photos/' + d.passport + '.svg');
const map = L.map('map', {zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:20,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
const icon = L.divIcon({className:'', html:'<div class="pin"></div>', iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8], tooltipAnchor:[8,0]});
const isTouch = matchMedia('(hover: none)').matches;
const markers = [];
DATA.forEach(d => {
  const m = L.marker([d.lat, d.lon], {icon}).addTo(map);
  if (!isTouch) m.bindTooltip(`<img src="${d.img}"><div class="cap"><b>${d.passport}</b> · ${d.size} м · ${d.area_m2} м²<br>${d.address}</div>`,
    {className:'photo-tip', direction:'right', opacity:1});
  m.bindPopup(`<div class="pp"><img src="${d.img}"><div class="body"><h3>${d.passport} · ${d.ctype||''}</h3>
    <table>
    <tr><td>Адрес</td><td>${d.address}</td></tr>
    <tr><td>№ рекламного места</td><td>${d.place_no}</td></tr>
    <tr><td>Размер / площадь</td><td>${d.size} м · ${d.area_m2} м²${d.tech?' · '+d.tech:''}</td></tr>
    <tr><td>Формат / стороны</td><td>${d.fmt} · ${d.sides} стор.</td></tr>
    <tr><td>Размещение</td><td>${d.placement}</td></tr>
    <tr><td>Срок действия</td><td>с ${d.issued} по ${d.valid_until}</td></tr>
    <tr><td>Владелец</td><td>${d.owner}</td></tr>
    <tr><td>Координаты</td><td>${d.lat.toFixed(6)}, ${d.lon.toFixed(6)}</td></tr>
    </table></div></div>`, {maxWidth:360, minWidth:260});
  markers.push(m);
  const li = document.createElement('li');
  li.innerHTML = `<img src="${d.img}"><div><b>${d.passport}</b><span>${d.address}</span></div>`;
  li.onclick = () => { map.flyTo([d.lat, d.lon], Math.max(map.getZoom(), 16)); m.openPopup(); };
  document.getElementById('list').appendChild(li);
});
document.getElementById('count').textContent = `${DATA.length} носителей · Ташкент · наведите на пин — фото, клик — паспорт`;
map.fitBounds(L.featureGroup(markers).getBounds().pad(0.15));
</script></body></html>
